name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Azure deployment script contract tests
        run: |
          for test_file in scripts/*.test.sh; do
            printf 'Running %s\n' "$test_file"
            bash "$test_file"
          done

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker build --tag twilio-comics:test .
      - name: Verify runtime image works as nextjs without network access
        run: |
          docker run --rm --network none twilio-comics:test \
            sh -eu -c '
              test "$(id -un)" = nextjs
              test "$(pnpm --version)" = 10.20.0
              pnpm exec tsx --version
            '
      - run: docker build --file Dockerfile.migrate --tag twilio-comics-migrate:test .

  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --no-banner --redact

  postgres_url_guard:
    name: PostgreSQL URL literal guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-postgres-url-literals.test.py
      - run: python3 scripts/check-postgres-url-literals.py
      - run: python3 scripts/check-outgoing-postgres-urls.test.py

  validate:
    name: Validate
    if: always()
    needs: [quality, test, build, dependency_audit, secret_scan, postgres_url_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency_audit.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
          POSTGRES_URL_GUARD: ${{ needs.postgres_url_guard.result }}
        run: |
          if [ "$QUALITY" != "success" ] || [ "$TEST" != "success" ] || [ "$BUILD" != "success" ] || [ "$DEPENDENCY_AUDIT" != "success" ] || [ "$SECRET_SCAN" != "success" ] || [ "$POSTGRES_URL_GUARD" != "success" ]; then
            echo "Required checks: quality=$QUALITY test=$TEST build=$BUILD dependency_audit=$DEPENDENCY_AUDIT secret_scan=$SECRET_SCAN postgres_url_guard=$POSTGRES_URL_GUARD"
            exit 1
          fi
