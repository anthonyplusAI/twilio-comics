name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Azure deployment script contract tests
        run: |
          for test_file in scripts/*.test.sh; do
            printf 'Running %s\n' "$test_file"
            bash "$test_file"
          done

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker build --tag twilio-comics:test .
      - name: Verify runtime image works as nextjs without network access
        run: |
          docker run --rm --network none twilio-comics:test \
            sh -eu -c '
              test "$(id -un)" = nextjs
              test "$(pnpm --version)" = 10.20.0
              pnpm exec tsx --version
            '
      - run: docker build --file Dockerfile.migrate --tag twilio-comics-migrate:test .

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --no-banner --redact

  validate:
    name: Validate
    if: always()
    needs: [quality, test, build, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          if [ "$QUALITY" != "success" ] || [ "$TEST" != "success" ] || [ "$BUILD" != "success" ] || [ "$SECURITY" != "success" ]; then
            echo "Required checks: quality=$QUALITY test=$TEST build=$BUILD security=$SECURITY"
            exit 1
          fi
