name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_REPOSITORY: twilio-comics
  ACA_NAME: ${{ vars.ACA_NAME }}
  ACA_JOB_NAME: ${{ vars.ACA_JOB_NAME }}
  ACA_RECOVERY_JOB_NAME: ${{ vars.ACA_RECOVERY_JOB_NAME }}
  ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    if: ${{ needs.ci.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.pushed.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v4
      - name: Compute commit image tag
        id: image
        run: echo "value=${ACR_NAME}.azurecr.io/${ACR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pin pushed image digest
        id: pushed
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "value=${ACR_NAME}.azurecr.io/${ACR_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Check database migration state (read only)
        run: node --import tsx scripts/check-migration-preflight.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply database schema
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy generation job
        run: |
          az containerapp job update \
            --name "$ACA_JOB_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars "RELEASE_SHA=$GITHUB_SHA"
      - name: Deploy scheduled recovery job
        run: |
          az containerapp job update \
            --name "$ACA_RECOVERY_JOB_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --command pnpm \
            --args start:worker \
            --cron-expression '*/5 * * * *' \
            --set-env-vars "RELEASE_SHA=$GITHUB_SHA" 'RECOVERY_MODE=1'
      - name: Deploy web and voice app
        run: |
          az containerapp update \
            --name "$ACA_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars "RELEASE_SHA=$GITHUB_SHA" \
            --termination-grace-period 240 \
            --min-replicas 1 \
            --max-replicas 2
      - name: Resolve app URL
        id: app
        run: |
          FQDN=$(az containerapp show --name "$ACA_NAME" --resource-group "$ACA_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$FQDN"
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
      - name: Smoke test new deployment
        env:
          FQDN: ${{ steps.app.outputs.fqdn }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /tmp/health.json --write-out "%{http_code}" "https://${FQDN}/api/healthz" || true)
            if [ "$status" = "200" ] && jq --exit-status --arg release "$EXPECTED_RELEASE" '.release == $release' /tmp/health.json >/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status}"
            sleep 10
          done
          exit 1
